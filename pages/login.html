<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | fodecorses</title>
    <link rel="stylesheet" href="../styles/login-signup.css" />
  </head>
  <body>
    <div class="auth-card">
      <div class="logo">&lt;/&gt;</div>
      <h1 class="brand">fode<span>corses</span></h1>
      <p class="tagline">Solve · Compete · Improve</p>

      <div class="heading">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>
      </div>

      <form action="#" method="post">
        <div class="form-group">
          <label for="handle">Handle</label>
          <input
            type="text"
            id="handle"
            name="handle"
            placeholder="Enter your handle"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button onclick="window.location.href='./home.html' " type="submit" class="auth-button">
          Login <span>&rarr;</span>
        </button>
      </form>

      <p class="switch-page">
        Don't have an account?
        <a href="signup.html">Sign up</a>
      </p>
    </div>
  </body>
</html>
