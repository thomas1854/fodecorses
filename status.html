<!DOCTYPE html>

<head>
    <title>Fodecorses - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-bars">
                <span class="bar-left"></span>
                <span class="bar-middle"></span>
                <span class="bar-right"></span>
            </div>

            <span class="logo-text"><span class="highlight-letter">F</span>ODECORSES</span>
        </div>

        <ul class="nav-links">
            <li><a href="#"> problemset </a></li>
            <li><a href="#">My Submissions</a></li>
            <li><a href="#">Standings</a></li>
            <li><a href="#">Status</a></li>
        </ul>

        <div class="auth-buttons">
            <button>Login</button>
            <button>Register</button>
        </div>

    </nav>

    <!-- Main Title & Header Section -->
    <div class="main-header">

        <h1>Problemset</h1>
        <button class="btn-add">+ Add problem</button>
    </div>

    <!-- Problems List Container -->
    <div class="problem-container">

        <div class="problem-card">
            <div class="problem-info">
                <h3> A. Can solve it ?</h3>
                <span class="difficulty">Easy</span>
                <span class="time-limit">1.0s</span>
            </div>

            <div class="problem-actions">
                <a href="#" class="btn-try">Try</a>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>

            </div>

        </div>

        <div class="problem-card">
            <div class="problem-info">
                <h3>B. Way Too Long Words</h3>
                <span class="difficulty">Easy</span>
                <span class="time-limit">1.0s</span>
            </div>

            <div class="problem-actions">
                <a href="#" class="btn-try">Try</a>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>

            </div>

        </div>

        <div class="problem-card">
            <div class="problem-info">
                <h3>C. String Task</h3>
                <span class="difficulty">Easy</span>
                <span class="time-limit">1.0s</span>
            </div>

            <div class="problem-actions">
                <a href="#" class="btn-try">Try</a>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>

            </div>

        </div>

        <div class="problem-card">
            <div class="problem-info">
                <h3>D. Graph Theory</h3>
                <span class="difficulty">Easy</span>
                <span class="time-limit">1.0s</span>
            </div>

            <div class="problem-actions">
                <a href="#" class="btn-try">Try</a>
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p> &copy; 2026 Fodecorses. All rights reserved.</p>
    </footer>

</body>

</html>
